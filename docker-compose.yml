version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pulseboard_db
    environment:
      POSTGRES_USER: pulseboard_user
      POSTGRES_PASSWORD: pulseboard_password
      POSTGRES_DB: pulseboard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseboard_user -d pulseboard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulseboard_backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgres://pulseboard_user:pulseboard_password@postgres:5432/pulseboard_db
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulseboard_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
